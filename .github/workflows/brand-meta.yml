name: Atualizar identidade do site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  brand-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adicionar favicon e metadados da marca
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          marker = 'rel="icon" type="image/png"'
          if marker not in text:
              old = '<meta name="description" content="JM Elétrica e Construções — serviços elétricos, reformas, manutenção, segurança e carregadores para veículos elétricos.">'
              new = old + '''
<meta name="theme-color" content="#050b13">
<link rel="icon" type="image/png" href="jm.png?v=2">
<link rel="apple-touch-icon" href="jm.png?v=2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JM Elétrica e Construções">
<meta property="og:title" content="JM Elétrica e Construções">
<meta property="og:description" content="Serviços elétricos, reformas, manutenção, segurança e construção com qualidade e compromisso.">
<meta property="og:url" content="https://johnycristiansan-oss.github.io/jm-eletrica-e-contrucoes/">
<meta property="og:image" content="https://johnycristiansan-oss.github.io/jm-eletrica-e-contrucoes/jm.png?v=2">
<meta property="og:image:alt" content="Logo JM Elétrica e Construções">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="JM Elétrica e Construções">
<meta name="twitter:description" content="Serviços elétricos, reformas, manutenção, segurança e construção.">
<meta name="twitter:image" content="https://johnycristiansan-oss.github.io/jm-eletrica-e-contrucoes/jm.png?v=2">'''
              if old not in text:
                  raise SystemExit("Meta description não encontrada; nenhuma alteração feita.")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Publicar alteração
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza favicon e metadados da marca"
          git push
