<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JM Orçamentos</title>
<style>
:root{--navy:#071b36;--blue:#0d3b73;--yellow:#f5bd16;--red:#e3262e;--bg:#f5f7fa;--text:#17202a;--muted:#718096;--line:#e1e7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}button,input{font:inherit}.app{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--bg)}header{background:var(--navy);color:#fff;padding:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--red);font-weight:900;font-size:22px;border:3px solid var(--red)}.brand b{font-size:17px}.brand span{display:block;color:#ffd85c;font-size:12px;font-weight:800;margin-top:3px}.progress{margin-top:18px}.bar{height:7px;background:#ffffff25;border-radius:8px}.fill{height:100%;width:12%;background:var(--yellow);border-radius:8px}.progressrow{display:flex;justify-content:space-between;font-size:11px;color:#c8d3e0;margin-top:6px}.chat{padding:18px 14px 110px}.msg{display:flex;gap:9px;margin:14px 0}.avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none}.bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:13px 14px;max-width:85%;box-shadow:0 2px 8px #0000000d}.user{justify-content:flex-end}.user .bubble{background:var(--blue);color:#fff;border-radius:16px 16px 5px 16px}.choices{display:grid;gap:9px;margin:7px 0 17px 43px}.choice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 12px;text-align:left;color:var(--blue);font-weight:800}.choice:active{border-color:var(--yellow);transform:scale(.99)}.photo{margin:10px 0 14px 43px;background:#fff;border:1px dashed #9bb3d0;border-radius:14px;padding:18px;text-align:center}.photo button{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:12px 15px;font-weight:800}.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.thumb{width:65px;height:65px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px;margin:10px 0 15px 43px}.actions button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--blue);font-weight:800}.actions .red{background:var(--red);color:#fff;border-color:var(--red)}.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:15px 0}.summary h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f4;font-size:13px}.row span{color:var(--muted)}.success{background:#eaf8ee;color:#176b35;border:1px solid #bfe6cb;padding:13px;border-radius:12px;font-weight:800}.input{position:fixed;bottom:0;width:min(430px,100%);padding:10px 12px;background:#fffffff5;border-top:1px solid var(--line);display:flex;gap:8px}.input input{flex:1;border:1px solid #d6dee8;border-radius:13px;padding:12px}.send{width:48px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900}
</style>
</head>
<body><div class="app"><header><div class="brand"><div class="logo">JM</div><div><b>Novo orçamento</b><span>JM Elétrica e Construção</span></div></div><div class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div class="progressrow"><span id="label">Escolha o serviço</span><span id="step">Etapa 1</span></div></div></header><main id="chat" class="chat"></main><div class="input"><input id="text" placeholder="Digite uma mensagem..."><button class="send" onclick="sendText()">➤</button></div></div>
<script>
const state={service:'',answers:{},photos:[]};let step=0;
const flows={
Elétrica:[['O que você precisa fazer?',['Instalar algo novo','Consertar algo','Fazer manutenção'],'tipo'],['O que você quer instalar ou consertar?',['Tomadas','Iluminação','Chuveiro'],'subtipo'],['Onde será o serviço?',['Dentro de casa','Fora de casa','Outro local'],'local'],['Mais ou menos quantos pontos?',['1 a 3','4 a 10','Mais de 10'],'quantidade'],['Quando gostaria de fazer?',['O mais rápido possível','Nesta semana','Na próxima semana'],'prazo']],
Construção:[['O que você pretende fazer?',['Construir','Ampliar','Reformar'],'tipo'],['É um serviço pequeno, médio ou grande?',['Pequeno','Médio','Grande'],'tamanho'],['O local já está preparado?',['Sim','Mais ou menos','Não'],'preparo'],['Quando gostaria de começar?',['O mais rápido possível','Nesta semana','Na próxima semana'],'prazo']],
Pintura:[['O que você quer pintar?',['Uma parede','Um cômodo','A casa toda'],'alvo'],['Mais ou menos qual o tamanho?',['Pequeno — até 20 m²','Médio — 20 a 50 m²','Grande — mais de 50 m²'],'tamanho'],['Como estão as paredes?',['Boas, só pintar','Alguns problemas','Bem danificadas'],'estado'],['Quando gostaria de fazer?',['O mais rápido possível','Nesta semana','Na próxima semana'],'prazo']],
Reforma:[['O que você quer reformar?',['Banheiro','Cozinha','Outro ambiente'],'ambiente'],['Qual o tamanho aproximado?',['Pequeno','Médio','Grande'],'tamanho'],['Quando gostaria de começar?',['O mais rápido possível','Nesta semana','Na próxima semana'],'prazo']],
Segurança:[['O que você quer instalar?',['Câmeras','Alarme','Outro item'],'item'],['É para qual local?',['Casa','Empresa','Outro local'],'local'],['Mais ou menos quantos pontos?',['1 a 3','4 a 8','Mais de 8'],'quantidade']],
'Carregador de carro elétrico':[['Onde quer instalar?',['Casa','Condomínio','Empresa'],'local'],['Você já tem um carregador?',['Sim','Ainda não','Não sei qual comprar'],'carregador'],['A vaga fica perto do quadro de energia?',['Sim','Mais ou menos','Não sei'],'distancia']]
};
function bot(t){chat.innerHTML+=`<div class="msg"><div class="avatar">🤖</div><div class="bubble">${t}</div></div>`;down()}
function user(t){chat.innerHTML+=`<div class="msg user"><div class="bubble">${t}</div></div>`;down()}
function choose(arr,key){let b=document.createElement('div');b.className='choices';arr.forEach(x=>{let q=document.createElement('button');q.className='choice';q.textContent=x;q.onclick=()=>{state.answers[key]=x;user(x);b.remove();next()};b.appendChild(q)});chat.appendChild(b);down()}
function start(){bot('Olá! 👋<br>Vou fazer algumas perguntas simples para entender o que você precisa.');bot('Qual serviço você precisa?');choose(['Elétrica','Construção','Pintura','Reforma','Segurança','Carregador de carro elétrico'],'service')}
function next(){if(!state.service){state.service=state.answers.service;label.textContent=state.service}let f=flows[state.service];if(step<f.length){let q=f[step++];bot(q[0]);choose(q[1],q[2]);fill.style.width=Math.min(90,15+step/f.length*70)+'%';document.getElementById('step').textContent='Etapa '+(step+1);if(step===f.length){} }else photos()}
function photos(){bot('Quer adicionar fotos do local? Você pode enviar várias fotos se quiser.');let d=document.createElement('div');d.className='photo';d.innerHTML='<button onclick="pick()">📷 Adicionar fotos</button><div id="thumbs" class="thumbs"></div><div style="font-size:11px;color:#718096;margin-top:8px">Até 15 fotos</div>';chat.appendChild(d);let a=document.createElement('div');a.className='actions';a.innerHTML='<button onclick="finish()">Pular</button><button class="red" onclick="finish()">Continuar</button>';chat.appendChild(a);down()}
function pick(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=e=>{[...e.target.files].slice(0,15-state.photos.length).forEach(f=>state.photos.push(URL.createObjectURL(f)));let t=document.getElementById('thumbs');t.innerHTML=state.photos.map(s=>`<img class="thumb" src="${s}">`).join('')};i.click()}
function finish(){document.querySelectorAll('.photo,.actions').forEach(e=>e.remove());bot('Perfeito! Já tenho as informações necessárias.');let s=document.createElement('div');s.className='summary';s.innerHTML='<h3>📋 Resumo do pedido</h3><div class="row"><span>Serviço</span><b>'+state.service+'</b></div>'+Object.entries(state.answers).filter(([k])=>k!=='service').map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')+`<div class="row"><span>Fotos</span><b>${state.photos.length}</b></div><div class="actions" style="margin:12px 0 0"><button onclick="location.reload()">Corrigir</button><button class="red" onclick="submitReq()">Enviar solicitação</button></div>`;chat.appendChild(s);fill.style.width='100%';document.getElementById('step').textContent='Concluído';down()}
function submitReq(){let s=document.createElement('div');s.className='success';s.textContent='✅ Solicitação criada! Na próxima etapa vamos conectar você aos profissionais disponíveis e à agenda.';chat.appendChild(s);down()}
function sendText(){let i=document.getElementById('text');let v=i.value.trim();if(v){user(v);i.value='';bot('Entendi! Vou considerar essa informação na sua solicitação.')}}
function down(){setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),30)}
start();
</script></body></html>
