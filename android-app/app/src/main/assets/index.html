<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JM Orçamentos</title>
<style>
:root{--navy:#071b36;--blue:#0d3b73;--red:#df242d;--yellow:#f3bd19;--bg:#f5f7fa;--text:#16202b;--muted:#6d7b8b;--line:#e1e6ed;--card:#fff}*{box-sizing:border-box}body{margin:0;background:#e9edf2;font-family:Arial,sans-serif;color:var(--text)}button,input,textarea{font:inherit}.app{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--bg)}.top{background:linear-gradient(150deg,var(--navy),#0b2d57);color:#fff;padding:22px 18px 26px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:14px;background:#fff;color:var(--red);border:3px solid var(--red);display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{font-size:17px}.brand small{display:block;color:#f6ce54;margin-top:4px;font-weight:700}.hero{margin-top:24px}.hero h1{font-size:27px;line-height:1.08;margin:0 0 8px}.hero p{margin:0;color:#d6dfeb;font-size:14px;line-height:1.45}.main{padding:18px 15px 30px}.primary{width:100%;padding:16px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:16px;box-shadow:0 8px 18px #df242d33}.section-title{font-size:15px;font-weight:900;margin:22px 2px 10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button,.service,.info-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}.quick button{color:var(--blue);font-weight:800}.quick button span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:5px}.servicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service{min-height:96px;color:var(--blue);font-weight:900}.service small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.screen{display:none}.screen.active{display:block}.head{background:var(--navy);color:#fff;padding:14px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}.back{border:0;background:#ffffff16;color:#fff;border-radius:10px;padding:9px 11px}.head b{font-size:15px}.content{padding:18px 15px 100px}.progress{height:6px;background:#dfe5ec;border-radius:10px;margin-bottom:18px}.progress i{display:block;height:100%;background:var(--yellow);border-radius:10px;width:20%}.qtitle{font-size:22px;line-height:1.18;margin:8px 0}.hint{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:15px}.choices{display:grid;gap:10px}.choice{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:left;color:var(--blue);font-weight:800}.choice:active{border-color:var(--yellow)}.choice.other{border-style:dashed}.field{width:100%;border:1px solid #cfd8e3;background:#fff;border-radius:13px;padding:14px;min-height:50px;resize:vertical}.bottom{position:fixed;bottom:0;width:min(430px,100%);background:#fffffff7;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:9px;z-index:5}.bottom button{flex:1;padding:13px;border-radius:12px;font-weight:900;border:1px solid var(--line);background:#fff;color:var(--blue)}.bottom .next{background:var(--red);color:#fff;border-color:var(--red)}.photos{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.photos img{width:78px;height:78px;object-fit:cover;border-radius:10px}.addphoto{width:100%;padding:16px;border:1px dashed #9aafc7;border-radius:14px;background:#fff;color:var(--blue);font-weight:900}.notice{background:#fff8df;border:1px solid #f0d87b;border-radius:12px;padding:13px;font-size:12px;line-height:1.45;color:#6b5410;margin-top:14px}.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.sumrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f4;font-size:13px}.sumrow span{color:var(--muted)}.success{background:#e9f8ee;border:1px solid #b9e2c7;color:#17652f;border-radius:14px;padding:15px;font-weight:800;margin-top:12px}.hidden{display:none!important}
</style></head>
<body><div class="app">
<section id="home" class="screen active"><header class="top"><div class="brand"><div class="logo">JM</div><div><b>JM Elétrica e Construção</b><small>Orçamentos e serviços</small></div></div><div class="hero"><h1>Encontre o profissional certo para o seu serviço.</h1><p>Conte o que você precisa. Nós organizamos as informações para encontrar profissionais compatíveis.</p></div></header><main class="main"><button class="primary" onclick="start()">Solicitar orçamento</button><div class="section-title">Acompanhe seus pedidos</div><div class="quick"><button>📋 Meus orçamentos<span>Consulte seus pedidos</span></button><button>📍 Acompanhar<span>Veja o andamento</span></button><button>💬 Mensagens<span>Converse quando necessário</span></button><button>⭐ Avaliações<span>Veja seus serviços concluídos</span></button></div><div class="section-title">Serviços populares</div><div class="servicegrid"><button class="service" onclick="start('Elétrica')">⚡ Elétrica<small>Instalações e manutenção</small></button><button class="service" onclick="start('Pintura')">🎨 Pintura<small>Interna e externa</small></button><button class="service" onclick="start('Reforma')">🏠 Reforma<small>Ambientes e reparos</small></button><button class="service" onclick="start('Segurança')">🔒 Segurança<small>Câmeras e alarmes</small></button></div></main></section>
<section id="wizard" class="screen"><header class="head"><button class="back" onclick="goBack()">←</button><b>Novo orçamento</b></header><main class="content"><div class="progress"><i id="prog"></i></div><div id="question"></div><div class="bottom"><button id="backBottom" onclick="goBack()">← Voltar</button><button class="next" id="nextBottom" onclick="next()">Continuar →</button></div></main></section>
</div>
<script>
const services=['Instalação elétrica','Manutenção elétrica','Tomadas e interruptores','Iluminação','Chuveiro elétrico','Quadro e disjuntores','Fiação','Ventilador de teto','Construção','Reforma','Alvenaria','Pisos e revestimentos','Telhado','Forro e drywall','Pintura interna','Pintura externa','Fachada','Câmeras de segurança','Alarmes','Interfone','Vídeo porteiro','Fechadura eletrônica','Controle de acesso','Cerca elétrica','Carregador de carro elétrico','Instalação de equipamentos','Pequenos reparos','Outro serviço'];
const state={answers:{},photos:[]};let history=[],current=null;
function start(pre=''){show('wizard');history=[];state.answers={};state.photos=[];current={key:'service',title:'Qual serviço você precisa?',hint:'Escolha a opção que mais se aproxima do que você precisa.',options:services};if(pre){state.answers.service=pre;current={key:'property',title:'Onde será realizado o serviço?',hint:'Essa informação ajuda a encontrar profissionais que atendem esse tipo de local.',options:['Casa / imóvel residencial','Prédio / condomínio','Local comercial / empresa','Outro local']};history.push({key:'service',value:pre});}render()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function render(){const q=document.getElementById('question');document.getElementById('prog').style.width=Math.min(94,18+history.length*12)+'%';document.getElementById('backBottom').style.visibility=history.length?'visible':'hidden';if(current.type==='photos'){q.innerHTML='<h2 class="qtitle">Adicione fotos do local</h2><p class="hint">Você pode enviar várias fotos. Elas ajudam o profissional a entender melhor o serviço.</p><button class="addphoto" onclick="pick()">📷 Adicionar fotos</button><div id="photos" class="photos">'+state.photos.map(x=>'<img src="'+x+'">').join('')+'</div><div class="notice"><b>Importante:</b> as medidas e informações são fornecidas pelo cliente e podem ser aproximadas. A confirmação técnica será feita pelo profissional antes da execução.</div>';document.getElementById('nextBottom').textContent='Revisar pedido →';return}q.innerHTML='<h2 class="qtitle">'+current.title+'</h2><p class="hint">'+current.hint+'</p><div class="choices">'+current.options.map((o,i)=>'<button class="choice" onclick="select('+i+')">'+o+'</button>').join('')+'</div>'+(current.allowText?'<textarea id="custom" class="field" placeholder="Descreva brevemente..."></textarea>':'');document.getElementById('nextBottom').textContent='Continuar →'}
function select(i){const v=current.options[i];if(v.toLowerCase().startsWith('outro')){current={key:'custom_'+Date.now(),title:current.key==='service'?'Qual serviço você precisa?':'Descreva o que você precisa',hint:'Escreva com suas palavras. Não precisa usar termos técnicos.',type:'text',options:[]};render();return}state.answers[current.key]=v;history.push({key:current.key,value:v});buildNext()}
function buildNext(){const k=current.key;if(k==='service'){current={key:'property',title:'Onde será realizado o serviço?',hint:'Escolha o tipo de local.',options:['Casa / imóvel residencial','Prédio / condomínio','Local comercial / empresa','Outro local']}}else if(k==='property'){current={key:'size',title:'Qual o tamanho aproximado do local?',hint:'Uma estimativa já ajuda. Você poderá corrigir depois.',options:['Pequeno','Médio','Grande','Não sei informar']}}else if(k==='size'){current={key:'details',title:'Como você prefere informar as medidas?',hint:'Escolha a opção mais fácil para você.',options:['Tenho a medida em metros','Tenho a área em m²','Só consigo informar aproximadamente','Não sei informar']}}else if(k==='details'){current={key:'availability',title:'Quando gostaria de realizar o serviço?',hint:'Isso ajuda a cruzar sua solicitação com a agenda dos profissionais.',options:['O mais rápido possível','Nesta semana','Na próxima semana','Ainda não sei']}}else if(k==='availability'){current={key:'photos',type:'photos'}}else if(k.startsWith('custom_')){state.answers.custom= document.getElementById('custom')?.value||'';history.push({key:'custom',value:state.answers.custom});current={key:'property',title:'Onde será realizado o serviço?',hint:'Escolha o tipo de local.',options:['Casa / imóvel residencial','Prédio / condomínio','Local comercial / empresa','Outro local']}}else{current={key:'photos',type:'photos'}}render()}
function next(){if(current.type==='text'){const v=(document.getElementById('custom')?.value||'').trim();if(!v)return;state.answers.custom=v;history.push({key:'custom',value:v});buildNext();return}if(current.type==='photos'){review();return}const first=current.options[0];if(!state.answers[current.key]){select(0)}}
function goBack(){if(!history.length){show('home');return}history.pop();if(!history.length){start();return}state.answers={};history.forEach(x=>state.answers[x.key]=x.value);const last=history[history.length-1];if(last.key==='service')current={key:'property',title:'Onde será realizado o serviço?',hint:'Escolha o tipo de local.',options:['Casa / imóvel residencial','Prédio / condomínio','Local comercial / empresa','Outro local']};else if(last.key==='property')current={key:'size',title:'Qual o tamanho aproximado do local?',hint:'Uma estimativa já ajuda. Você poderá corrigir depois.',options:['Pequeno','Médio','Grande','Não sei informar']};else if(last.key==='size')current={key:'details',title:'Como você prefere informar as medidas?',hint:'Escolha a opção mais fácil para você.',options:['Tenho a medida em metros','Tenho a área em m²','Só consigo informar aproximadamente','Não sei informar']};else if(last.key==='details')current={key:'availability',title:'Quando gostaria de realizar o serviço?',hint:'Isso ajuda a cruzar sua solicitação com a agenda dos profissionais.',options:['O mais rápido possível','Nesta semana','Na próxima semana','Ainda não sei']};render()}
function pick(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=e=>{[...e.target.files].slice(0,15-state.photos.length).forEach(f=>state.photos.push(URL.createObjectURL(f)));render()};i.click()}
function review(){show('wizard');document.querySelector('.head b').textContent='Revisar pedido';const q=document.getElementById('question');q.innerHTML='<h2 class="qtitle">Confira seu pedido</h2><p class="hint">Você pode voltar e alterar qualquer resposta.</p><div class="summary">'+Object.entries(state.answers).filter(([k,v])=>v).map(([k,v])=>'<div class="sumrow"><span>'+label(k)+'</span><b>'+v+'</b></div>').join('')+'<div class="sumrow"><span>Fotos</span><b>'+state.photos.length+'</b></div></div><div class="notice"><b>Informações do cliente:</b> medidas, quantidades e condições são estimativas e não substituem a conferência do profissional. O valor final pode mudar após a avaliação técnica.</div><div class="bottom"><button onclick="goBack()">← Voltar</button><button class="next" onclick="submitReq()">Enviar solicitação</button></div>';document.getElementById('prog').style.width='100%'}
function label(k){return ({service:'Serviço',property:'Local',size:'Tamanho',details:'Medidas',availability:'Prazo',custom:'Descrição'})[k]||'Informação'}
function submitReq(){document.getElementById('question').innerHTML='<div class="success">✅ Solicitação registrada.<br><br>Agora o sistema poderá procurar profissionais que atendam o serviço, a região e a disponibilidade informadas.</div>';document.querySelector('.head b').textContent='Solicitação enviada';document.querySelector('.bottom').innerHTML='<button class="next" onclick="show(\'home\')">Voltar para início</button>'}
</script></body></html>
